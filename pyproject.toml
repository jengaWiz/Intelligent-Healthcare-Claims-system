[project]
name = "intelligent-healthcare-claims-system"
version = "0.2.0"
description = "Synthetic healthcare document extraction and review prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "azure-ai-documentintelligence==1.0.2",
  "fastapi==0.142.2",
  "langchain-core==1.6.6",
  "langchain-google-genai==4.4.0",
  "langchain-openai==1.6.7",
  "langgraph==1.2.12",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.54",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated migrated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
