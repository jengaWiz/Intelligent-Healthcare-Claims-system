name: Claim CI
on:
  pull_request:
  push:
    branches: [ayaan]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.17'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python scripts/check_docs.py
      - run: uv run --locked pytest -m 'not integration' --junitxml=/tmp/unit-tests.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: /tmp/unit-tests.xml
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claims_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: claims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claims_test -d claims_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://claims_test:synthetic-ci-only@localhost:5432/claims_test
      TEST_DATABASE_URL: postgresql+psycopg://claims_test:synthetic-ci-only@localhost:5432/claims_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.17'
      - run: uv sync --locked
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - run: uv run --locked pytest -m integration --junitxml=/tmp/postgres-tests.xml -q
      - run: uv run --locked alembic downgrade base
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-results
          path: /tmp/postgres-tests.xml

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claims_browser
          POSTGRES_PASSWORD: synthetic-browser-only
          POSTGRES_DB: claims_browser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claims_browser -d claims_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://claims_browser:synthetic-browser-only@localhost:5432/claims_browser
      TEST_DATABASE_URL: postgresql+psycopg://claims_browser:synthetic-browser-only@localhost:5432/claims_browser
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: uv run --locked alembic upgrade head
      - run: npm ci --prefix tests/browser
      - run: npm exec --prefix tests/browser -- playwright install --with-deps chromium
      - run: uv run --locked python -m scripts.check_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: tests/browser/playwright-report
